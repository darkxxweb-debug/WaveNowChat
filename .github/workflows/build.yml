name: Build WaveNow APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        id: sdk
        continue-on-error: true
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tee sdk-log.txt

      - name: Generate Gradle wrapper if missing
        if: steps.sdk.outcome == 'success'
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew haipo - inaunda mpya..."
            sudo apt-get update -y && sudo apt-get install -y gradle
            gradle wrapper --gradle-version 8.7
          else
            echo "gradlew tayari ipo"
          fi

      - name: Make Gradle wrapper executable
        if: steps.sdk.outcome == 'success'
        run: chmod +x ./gradlew

      - name: Build debug APK
        id: build
        if: steps.sdk.outcome == 'success'
        continue-on-error: true
        run: ./gradlew assembleDebug --stacktrace --info 2>&1 | tee build-log.txt

      - name: Fail job if any step failed
        run: |
          if [ "${{ steps.sdk.outcome }}" == "failure" ] || [ "${{ steps.build.outcome }}" == "failure" ]; then
            echo "❌ Kuna step iliyofeli - angalia logs kwenye artifacts"
            exit 1
          fi

      - name: Check APK
        if: steps.build.outcome == 'success'
        run: |
          ls -lah app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK as artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: wavenow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload all logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-and-sdk-logs
          path: |
            sdk-log.txt
            build-log.txt
          if-no-files-found: ignore

      - name: Upload Gradle failure reports (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
